name: issue-worm

# Installs leonarduk/issue-worm (issue-worm-pro#581/#582) as a consumer
# would: an unrelated third-party repo, not one of issue-worm's own two
# home repos. Applying the `issue-worm` label to an issue dispatches the
# free engine against it on a plain GitHub-hosted runner.
#
# The `if:` guard below is LOAD-BEARING, not cosmetic - see
# leonarduk/issue-worm's own .github/workflows/issue-worm.yml for why.
on:
  issues:
    types: [labeled]

concurrency:
  group: issue-worm-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.event.label.name == 'issue-worm'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # @main, not a tag: no release of leonarduk/issue-worm yet contains
      # both action.yml and the OpenAI-compatible coder (#590) it needs -
      # see issue-worm-pro#581's tracking comment. Pin to a real tag once
      # one is cut.
      - uses: leonarduk/issue-worm@main
        with:
          issue: ${{ github.event.issue.number }}
          # A fine-grained PAT (or GitHub App token) with `contents: write`,
          # `pull-requests: write`, and `issues: read` on this repo - see
          # action.yml's github-token input. The default GITHUB_TOKEN
          # can't be used: a PR pushed with it wouldn't trigger this
          # repo's own CI (test.yml).
          github-token: ${{ secrets.WORM_PAT }}
        env:
          # cloud -> DeepSeek, via the OpenAI-compatible coder (#590).
          # ubuntu-latest has no route to a local Ollama host, so `local`
          # (the default) isn't usable here.
          CODER_MODEL_SOURCE: cloud
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
