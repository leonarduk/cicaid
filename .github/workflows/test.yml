name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package with test extras
        run: python -m pip install --upgrade pip && pip install -e ".[test]"

      - name: Run tests
        run: pytest --cov=cicaid_devtools --cov-report=term-missing
