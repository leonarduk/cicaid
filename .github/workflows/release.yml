name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

#      - name: Update README to this release's version
#        run: python scripts/bump_readme_version.py "${{ github.ref_name }}"

      - name: Push README update to main
        run: |
          if git diff --quiet README.md; then
            echo "README.md unchanged; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README install commands to ${{ github.ref_name }}"
          # HEAD is the tagged commit (detached); fast-forward main to it plus
          # this commit, since the tag is always cut from main's current tip.
          git push origin HEAD:main
