name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Update README to this release's version
        run: python scripts/bump_readme_version.py "${{ github.ref_name }}"

      - name: Push README update to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet README.md; then
            echo "README.md unchanged; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README install commands to ${{ github.ref_name }}"

          # Push to a temp branch and merge via PR (works with branch protection)
          BRANCH="readme-bump-${GITHUB_REF_NAME#v}"
          git checkout -b "$BRANCH"
          git push --force origin "$BRANCH"

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Update README install commands to ${{ github.ref_name }}" \
            --body "Automated version bump triggered by release ${{ github.ref_name }}.")
          echo "Created $PR_URL"

          if ! gh pr merge "$PR_URL" --merge; then
            echo "::warning::Could not auto-merge the README PR."
            echo "::warning::See $PR_URL — merge it manually to update the README."
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
