[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cicaid-devtools"
version = "0.2.0"
description = "Shared issue/PR/review automation scripts (the developer_tools pipeline) for leonarduk repos"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.34.2,<3",
]

[project.optional-dependencies]
dotenv = [
    "python-dotenv>=1.0",
]
test = [
    "pytest~=9.0.3",
    "pytest-cov~=7.1.0",
]

[project.scripts]
sync-issues = "cicaid_devtools.a_sync_issues:main"
create-issue = "cicaid_devtools.b_create_issue:main"
triage-issues = "cicaid_devtools.c_triage_issues:main"
work-on-issue = "cicaid_devtools.d_work_on_issue:main"
work-on-pr = "cicaid_devtools.e_work_on_pr:main"
implement-issue-with-aider = "cicaid_devtools.f_implement_issue_with_aider:main"
run-ci-checks = "cicaid_devtools.h_run_ci_checks:main"
local-review = "cicaid_devtools.i_local_review:main"
pr-review = "cicaid_devtools.l_pr_review:main"
dependabot-auto-merge = "cicaid_devtools.m_dependabot_auto_merge:main"
review-issue = "cicaid_devtools.o_review_issue:main"
add-issue-to-pr = "cicaid_devtools.p_add_issue_to_pr:main"
clear-ai-slop-issues = "cicaid_devtools.q_clear_ai_slop_issues:main"
commit-and-push = "cicaid_devtools.lib.commit_and_push:main"
publish-pr = "cicaid_devtools.lib.publish_pr:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
